*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}

.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--grid);background:var(--surface);color:var(--ink)}

.tile .k{color:var(--ink2);font-size:12px}.tile .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}.tile .s{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:14px;margin-bottom:14px;overflow-x:auto}

th{color:var(--ink2);font-weight:600;font-size:12px}td.n{text-align:right}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;margin-right:3px;border:1px solid var(--grid)}
.pill.w{background:var(--wint);border-color:var(--win)}.pill.l{background:var(--losst);border-color:var(--loss)}.pill.w::before{content:"\25B2 ";color:var(--win)}.pill.l::before{content:"\25BC ";color:var(--loss)}
.ver{white-space:nowrap}.ver i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.tile{border-top:3px solid var(--grid)}.tile.pos{border-top-color:var(--win)}.tile.neg{border-top-color:var(--loss)}.tile.even{border-top-color:var(--even)}
svg text{fill:var(--ink2);font-size:12px}svg .lbl{fill:var(--ink)}

.legend{display:flex;gap:14px;color:var(--ink2);font-size:12px;margin:-4px 0 8px}.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

<div class="card"><h2>Per-map table</h2><div id="tbl"></div></div>

const $=id=>document.getElementById(id), tip=$('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';const x=Math.min(e.clientX+14,innerWidth-290);tip.style.left=x+'px';tip.style.top=(e.clientY+14)+'px'}
function hideTip(){tip.style.display='none'}
const fmtT=s=>new Date(s).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function opts(sel,vals,all){sel.innerHTML=`<option value="">${all}</option>`+vals.map(v=>`<option>${v}</option>`).join('')}
opts($('fv'),[...new Set(DATA.games.map(g=>g.version))].reverse(),'all versions');
opts($('fo'),[...new Set(DATA.matches.map(m=>m.opp))].sort(),'all opponents');

function filtered(){const v=$('fv').value,o=$('fo').value,n=+$('fn').value;
 let ms=DATA.matches.filter(m=>(!v||m.version===v)&&(!o||m.opp===o)); if(n)ms=ms.slice(-n);
 const ids=new Set(ms.map(m=>m.group)); return {ms,gs:DATA.games.filter(g=>ids.has(g.group))}}
const VCOL=['var(--v1)','var(--v2)','var(--v3)','var(--v4)','var(--v5)'];
const vorder=[...DATA.versions,'earlier'];
const vcol=v=>{const i=DATA.versions.indexOf(v);return i<0?'var(--muted)':VCOL[i%VCOL.length]};
const band=p=>p>=0.6?'var(--win)':p>=0.4?'var(--even)':'var(--loss)';
const vchip=v=>`<span class="ver"><i style="background:${vcol(v)}"></i>${v}</span>`;
function render(){
 const {ms,gs}=filtered(), L=DATA.ladder;
 $('sub').textContent=`${DATA.team} - ranked games only. Updated ${fmtT(DATA.updated)}; refreshes at :01 :11 :21 :31 :41 :51.`+(L?` Ladder #${L.rank} of ${L.of}, rating ${Math.round(L.rating)}.`:'');
 const mw=ms.filter(m=>m.won>m.lost).length, gw=gs.filter(g=>g.won).length;
 const avgM=gs.length?Math.round(gs.reduce((a,g)=>a+g.margin,0)/gs.length):0;
 const wins=gs.filter(g=>g.won), avgW=wins.length?Math.round(wins.reduce((a,g)=>a+g.margin,0)/wins.length):0;
 const tiles=[['Matches won',ms.length?`${mw}-${ms.length-mw}`:'-',ms.length?`${Math.round(100*mw/ms.length)}% of ${ms.length}`:'no matches'],
  ['Maps won',gs.length?`${gw}-${gs.length-gw}`:'-',gs.length?`${Math.round(100*gw/gs.length)}% of ${gs.length}`:''],
  ['Average margin',gs.length?(avgM>0?'+':'')+avgM:'-','gems per map, all games'],
  ['Average winning margin',wins.length?'+'+avgW:'-','gems, won maps only']];
 const cls=[ms.length?(mw/ms.length>=0.6?'pos':mw/ms.length>=0.4?'even':'neg'):'',gs.length?(gw/gs.length>=0.6?'pos':gw/gs.length>=0.4?'even':'neg'):'',avgM>0?'pos':avgM<0?'neg':'even',wins.length?'pos':''];
 $('tiles').innerHTML=tiles.map((t,i)=>`<div class="tile ${cls[i]}"><div class="k">${t[0]}</div><div class="v">${t[1]}</div><div class="s">${t[2]}</div></div>`).join('');
 // Margin over time, coloured by version
 const used=[...new Set(gs.map(g=>g.version))];
 $('vleg').innerHTML=used.map(v=>`<span><span class="sw" style="background:${vcol(v)};border-radius:50%"></span>${v}</span>`).join('')+'<span>above the line = won the map</span>';
 if(gs.length){const TW=Math.max(520,$('tl').clientWidth||900),TH=220,pl=46,pr=12,pt=10,pb=26,lim2=Math.max(200,...gs.map(g=>Math.abs(g.margin)));
  const tx=i=>pl+(TW-pl-pr)*(gs.length===1?0.5:i/(gs.length-1)),ty=v=>pt+(TH-pt-pb)*(1-(v+lim2)/(2*lim2));

  q+=`<text x="${pl}" y="${TH-6}">older</text><text x="${TW-pr}" y="${TH-6}" text-anchor="end">newer</text>`;
  $('tl').innerHTML=q+'</svg>'} else $('tl').innerHTML='<div class="empty">No games yet.</div>';

 // Win rate bars

 for(const t of [0,.25,.5,.75,1])s+=`<line x1="${x(t)}" x2="${x(t)}" y1="0" y2="${H-20}" stroke="var(--grid)"/><text x="${x(t)}" y="${H-6}" text-anchor="middle">${t*100}%</text>`;
 maps.forEach((m,i)=>{const d=by[m],p=d.w/d.n,y=i*rowH+6;
  s+=`<text class="lbl" x="${left-8}" y="${y+13}" text-anchor="end">${m}</text>`;
  s+=`<rect x="${x(0)}" y="${y}" width="${Math.max(x(p)-x(0),p>0?4:0)}" height="18" rx="4" fill="${band(p)}"/>`;
  s+=`<text x="${x(p)+6}" y="${y+13}">${Math.round(100*p)}% (${d.w}/${d.n})</text>`;
  s+=`<rect x="0" y="${y-4}" width="${W}" height="${rowH}" fill="transparent" data-tip="${m}: won ${d.w} of ${d.n} (${Math.round(100*p)}%)"/>`});
 $('wr').innerHTML=s+'</svg>';
 // Margin strip plot with average bar
 const lim=Math.max(200,...gs.map(g=>Math.abs(g.margin))),mx=v=>left+(W-left-40)*(v+lim)/(2*lim);
 let t=`<svg width="${W}" height="${H}" role="img" aria-label="Margin by map">`;
 for(const v of [-lim,-lim/2,0,lim/2,lim]){const xv=Math.round(v);t+=`<line x1="${mx(v)}" x2="${mx(v)}" y1="0" y2="${H-20}" stroke="var(--grid)" ${v===0?'stroke-width="2"':''}/><text x="${mx(v)}" y="${H-6}" text-anchor="middle">${xv>0?'+':''}${xv}</text>`}
 maps.forEach((m,i)=>{const d=by[m],y=i*rowH+6,a=d.avg;
  t+=`<text class="lbl" x="${left-8}" y="${y+13}" text-anchor="end">${m}</text>`;
  t+=`<rect x="${Math.min(mx(0),mx(a))}" y="${y+5}" width="${Math.max(Math.abs(mx(a)-mx(0)),2)}" height="8" rx="4" fill="${a>=0?'var(--win)':'var(--loss)'}" opacity=".35"/>`;
  d.games.forEach((g,j)=>{const jy=y+9+((j%3)-1)*5;t+=`<circle cx="${mx(g.margin)}" cy="${jy}" r="5" fill="${g.won?'var(--win)':'var(--loss)'}" stroke="var(--surface)" stroke-width="2" data-tip="${m} vs ${g.opp}<br>${g.us}-${g.them} (${g.margin>0?'+':''}${g.margin}) in ${g.rounds} rounds<br>${fmtT(g.time)} - ${g.version}<br>our deaths ${g.deaths}, kills ${g.kills}<br>they drafted ${g.opp_comp.join(', ')}"/>`})});
 $('mg').innerHTML=t+'</svg>';
 // Table
 $('tbl').innerHTML=`<table><tr><th>Map</th><th class="n">Games</th><th class="n">Win rate</th><th class="n">Avg margin</th><th class="n">Avg winning margin</th><th class="n">Our deaths / game</th></tr>`+
  maps.map(m=>{const d=by[m];return `<tr><td>${m}</td><td class="n">${d.n}</td><td class="n">${Math.round(100*d.w/d.n)}%</td><td class="n">${d.avg>0?'+':''}${Math.round(d.avg)}</td><td class="n">${d.avgw===null?'-':'+'+Math.round(d.avgw)}</td><td class="n">${d.deaths.toFixed(1)}</td></tr>`}).join('')+'</table>';

 const rec=[...ms].reverse().slice(0,25);
 $('recent').innerHTML=`<table><tr><th>When</th><th>Opponent</th><th>Version</th><th>Result</th><th>Maps</th><th class="n">Rating</th></tr>`+rec.map(mt=>{
  const gg=DATA.games.filter(g=>g.group===mt.group);const res=mt.won>mt.lost?'Won':'Lost';
  const rating=(mt.rating_before!=null&&mt.rating_after!=null)?`${Math.round(mt.rating_after)} (${mt.rating_after-mt.rating_before>=0?'+':''}${Math.round(mt.rating_after-mt.rating_before)})`:'-';
  return `<tr><td>${fmtT(mt.time)}</td><td>${mt.opp}</td><td>${vchip(mt.version)}</td><td>${res} ${mt.won}-${mt.lost}</td><td>${gg.map(g=>`<span class="pill ${g.won?'w':'l'}" title="${g.us}-${g.them}">${g.map}</span>`).join('')}</td><td class="n">${rating}</td></tr>`}).join('')+'</table>';

}

// Reload one minute after each 10-minute game slot (plus 40 s for the updater to finish).
(function schedule(){const now=new Date(),next=new Date(now);next.setSeconds(40,0);
